# ==========================================================
# CẤU HÌNH NGINX REVERSE PROXY & HTTPS LOCAL DEMO
# ==========================================================

# 1. Chuyển hướng toàn bộ HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Endpoint giám sát Nginx stub_status cho Prometheus exporter
    location /nginx_status {
        stub_status on;
        access_log off;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Máy chủ chính HTTPS (Port 443)
server {
    listen 443 ssl;
    http2 on;
    server_name localhost 127.0.0.1;

    root /var/www/html;
    index index.php index.html;

    # Chứng chỉ SSL tự ký
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Hardening: Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static assets (CSS, JS, Images)
    location ~ ^/(css|js|images)/ {
        root /var/www/html/public;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Định tuyến ứng dụng
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Chuyển tiếp mã PHP tới container PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Buffer & Timeout settings
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 120s;
    }

    # Chặn truy cập các file ẩn (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
