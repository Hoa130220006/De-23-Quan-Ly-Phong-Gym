name: gym-management

services:
  # -------------------------------------------------------------
  # 1. ỨNG DỤNG BACKEND PHP (PHP-FPM)
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym_app
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-gym_management}
      DB_USER: ${DB_USER:-gym_user}
      DB_PASS: ${DB_PASS:-GymSecret@2026}
    volumes:
      - ./app:/var/www/html
      - ./public:/var/www/html/public
      - app_logs:/var/log/app
    networks:
      - gym_frontend
      - gym_backend
    depends_on:
      mysql:
        condition: service_healthy

  # -------------------------------------------------------------
  # 2. CƠ SỞ DỮ LIỆU MYSQL 8.0
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: gym_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-GymRootAdmin@2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gym_management}
      MYSQL_USER: ${MYSQL_USER:-gym_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-GymSecret@2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/gym_management.sql:/docker-entrypoint-initdb.d/gym_management.sql:ro
    # Bảo mật: Không công khai port 3306 ra ngoài host
    networks:
      - gym_backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # -------------------------------------------------------------
  # 3. NGINX REVERSE PROXY & HTTPS (PORT 80 & 443)
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: gym_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT_HTTP:-80}:80"
      - "${APP_PORT_HTTPS:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./app:/var/www/html:ro
      - ./public:/var/www/html/public:ro
      - nginx_logs:/var/log/nginx
    networks:
      - gym_frontend
      - gym_monitoring
    depends_on:
      - app

  # -------------------------------------------------------------
  # 4. EXPORTERS GIÁM SÁT (MYSQL & NGINX)
  # -------------------------------------------------------------
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: gym_mysql_exporter
    restart: unless-stopped
    command:
      - "--config.my-cnf=/etc/my.cnf"
      - "--no-collect.slave_status"
    volumes:
      - ./docker/prometheus/my.cnf:/etc/my.cnf:ro
    networks:
      - gym_backend
      - gym_monitoring
    depends_on:
      mysql:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: gym_nginx_exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx/nginx_status
    networks:
      - gym_frontend
      - gym_monitoring
    depends_on:
      - nginx

  # -------------------------------------------------------------
  # 5. PROMETHEUS METRICS SCRAPER
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: gym_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - gym_monitoring

  # -------------------------------------------------------------
  # 6. GRAFANA DASHBOARDS & VISUALIZATION
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.3
    container_name: gym_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - gym_monitoring
    depends_on:
      - prometheus
      - loki

  # -------------------------------------------------------------
  # 7. LOKI LOG AGGREGATION
  # -------------------------------------------------------------
  loki:
    image: grafana/loki:3.0.0
    container_name: gym_loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - gym_monitoring

  # -------------------------------------------------------------
  # 8. PROMTAIL LOG SHIPPER
  # -------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.0.0
    container_name: gym_promtail
    restart: unless-stopped
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - app_logs:/var/log/app:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - gym_monitoring
    depends_on:
      - loki

# ---------------------------------------------------------------
# MẠNG CÁCH LY PHÂN TẦNG (NETWORK SEGREGATION HARDENING)
# ---------------------------------------------------------------
networks:
  gym_frontend:
    driver: bridge
  gym_backend:
    driver: bridge
  gym_monitoring:
    driver: bridge

# ---------------------------------------------------------------
# PHÂN VÙNG DỮ LIỆU PERSISTENT VOLUMES
# ---------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  nginx_logs:
    driver: local
  app_logs:
    driver: local
